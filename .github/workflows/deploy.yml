name: Deploy to GitHub Pages

# main への push でビルドし、GitHub Pages（HTTPS）へ公開する。
# 事前準備: リポジトリ Settings → Pages → Build and deployment → Source を
# 「GitHub Actions」に設定すること。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # テストが落ちたらビルドせず、deploy ジョブ（needs: build）も走らせない。
      - run: npm test
      # GoatCounter のサイトコードは .env.local（gitignore）に置いていて CI には
      # 渡らない。本番ビルド時だけ Actions secret から注入する（analytics.js は
      # import.meta.env.PROD && !!VITE_GOATCOUNTER_CODE のときだけ計測スクリプトを
      # 読み込む）。secret 未設定でもビルドは通り、計測が無効なだけ。
      - run: npm run build
        env:
          VITE_GOATCOUNTER_CODE: ${{ secrets.VITE_GOATCOUNTER_CODE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
